apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortener
  labels:
    app.kubernetes.io/name: url-shortener
spec:
  ingressClassName: nginx
  rules:
    - host: url-shortener.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: url-shortener
                port:
                  name: http
