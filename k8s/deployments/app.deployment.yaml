apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-app
  labels:
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/component: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/component: app
    spec:
      initContainers:
        # This waits for PostgreSQL and creates the schema before each app pod is
        # marked ready. The migration is idempotent, so two replicas are safe.
        - name: migrate-database
          image: url-shortener:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/database/migrate.js']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: database-url
      containers:
        - name: app
          image: url-shortener:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
