services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U url_shortener -d url_shortener']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-topics.sh',
          '--bootstrap-server',
          'kafka:19092',
          '--list',
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.1
    entrypoint: ['/opt/kafka/bin/kafka-topics.sh']
    command:
      [
        '--bootstrap-server',
        'kafka:19092',
        '--create',
        '--if-not-exists',
        '--topic',
        'urls.create',
        '--partitions',
        '1',
        '--replication-factor',
        '1',
      ]
    depends_on:
      kafka:
        condition: service_healthy

  migrate:
    build: .
    command: ['node', 'dist/apps/api/database/migrate.js']
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ['node', 'dist/apps/api/database/seed.js']
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  generator:
    build: .
    command: ['node', 'dist/apps/generator/main.js']
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  kafka_data:
