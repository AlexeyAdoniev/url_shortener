services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U url_shortener -d url_shortener']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ['node', 'dist/database/seed.js']
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: build
    command: yarn start:dev
    environment:
      DATABASE_URL: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Keep Linux container dependencies separate from any host node_modules.
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  app_node_modules:
